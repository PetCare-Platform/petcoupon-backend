spring.application.name=PetCoupon

# data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcoupon}
spring.datasource.username=${DB_USERNAME:root}
