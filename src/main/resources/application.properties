spring.application.name=PetCoupon
# data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcoupon}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# jpa
spring.jpa.open-in-view=false
# ddl-auto: 스키마 확정 전까지 update, 테이블 구조가 고정되면 validate로 전환
#
# ⚠️ validate로 전환하기 전에 반드시 확인: 지금은 @Index/@UniqueConstraint가 Hibernate
# auto-DDL로만 만들어지고 있고, 이걸 SQL로 따로 정의해두는 마이그레이션(Flyway/Liquibase 등)이
# 이 프로젝트엔 아직 없다. validate로 바꾸는 순간부터는 Hibernate가 스키마를 더 이상 안
# 만들어주므로, 아래 인덱스들을 SQL로 먼저 만들어두지 않으면 조용히 없는 채로 남아 관련
# 쿼리가 느려진다(에러 없이 그냥 성능만 나빠짐 — 알아채기 어렵다):
#   - coupon_issue: idx_issue_expire(status, expires_at), idx_issue_coupon_id(coupon_id, coupon_issue_id)
#   - coupon_issue_history: idx_history_coupon_id(coupon_id, history_id)
#   - issue_message: idx_issue_message_publish(status, retry_count, message_id),
#                    idx_issue_message_coupon_dlq(coupon_id, status, message_id),
#                    idx_issue_message_created_at(created_at),
#                    idx_issue_message_dlq_list(status, created_at, message_id),
#                    idx_issue_message_coupon_created_at(coupon_id, created_at)
#   - idempotency_key: idx_idem_created_at(created_at)
# (@UniqueConstraint들도 같은 이유로 위험하지만, 그건 빠지면 중복 데이터가 바로 에러로
# 드러나 상대적으로 알아채기 쉽다 — 위 목록은 "조용히" 느려지기만 하는 인덱스만 추렸다.)
spring.jpa.hibernate.ddl-auto = ${JPA_DDL_AUTO:update}
spring.jpa.show-sql = ${JPA_SHOW_SQL:false}

# Redis Config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Redis Stream 
coupon.issue.stream.enabled=true
coupon.issue.stream.key=coupon:issue:stream
coupon.issue.stream.group=coupon-issue-group
coupon.issue.stream.consumer=${HOSTNAME:local}-${random.uuid}

# XREADGROUP 한 번에 조회할 최대 메시지 수.
# 메시지 병렬 처리 수가 아니라 Redis 조회 명령의 COUNT 값
coupon.issue.stream.batch-size=${STREAM_CONSUMER_BATCH_SIZE:10}

# Redis Stream Pending Recovery
coupon.issue.stream.pending-recovery.enabled=${STREAM_PENDING_RECOVERY_ENABLED:true}

# 정상 처리 중인 메시지까지 회수하지 않도록 Lua + Outbox 처리 시간보다 길게 둔다.
coupon.issue.stream.pending-recovery.min-idle-time=${STREAM_PENDING_MIN_IDLE_TIME:PT1M}

# Pending 조회 및 회수 주기
coupon.issue.stream.pending-recovery.fixed-delay=${STREAM_PENDING_RECOVERY_FIXED_DELAY:PT5S}

# 한 번에 조회·회수할 Pending 메시지 수
coupon.issue.stream.pending-recovery.batch-size=${STREAM_PENDING_RECOVERY_BATCH_SIZE:100}

# 최초 처리를 포함한 최대 처리 횟수
coupon.issue.stream.pending-recovery.max-delivery-count=${STREAM_PENDING_MAX_DELIVERY_COUNT:3}

# 최대 처리 횟수를 초과한 메시지를 저장할 Redis Stream
coupon.issue.stream.pending-recovery.dlq-key=${STREAM_PENDING_DLQ_KEY:coupon:issue:stream:dlq}

# Redis Stream Consumer 읽기 오류 복구 재시도
# 1초 -> 2초 -> 4초 -> ... -> 최대 30초 간격으로 재시도
coupon.issue.stream.recovery.initial-delay=${STREAM_RECOVERY_INITIAL_DELAY:1s}
coupon.issue.stream.recovery.max-delay=${STREAM_RECOVERY_MAX_DELAY:30s}
coupon.issue.stream.recovery.multiplier=${STREAM_RECOVERY_MULTIPLIER:2}

# Event Status Scheduler
# cron 형식: 초 분 시 일 월 요일 — 기본값은 매분 0초마다 실행
event.status.scheduler.cron = 0 * * * * *

# 상태 전이 스케줄러 on/off. 기본은 켜짐이고, 앱 전체를 띄우는 테스트에서 끄는 용도다.
# 켜둔 채로 테스트를 돌리면 스케줄러가 공유 DB의 event/coupon 상태를 바꿔서
# 다른 테스트가 잡아둔 전제를 깨뜨린다(외래키 위반, 상태 불일치 등).
#
# 주기를 길게 잡는 방식은 쓰지 않는다. cron은 절대 시각 기준이라 "매시 정각"으로 두면
# 테스트가 정각을 걸치는 순간에만 실행돼, 재현되지 않는 실패가 된다.
event.status.scheduler.enabled=${EVENT_STATUS_SCHEDULER_ENABLED:true}
coupon.status.enabled=${COUPON_STATUS_SCHEDULER_ENABLED:true}

# 정합성 검증 자동 스케줄러(#155). ReconciliationScheduler 의 @ConditionalOnProperty 가
# matchIfMissing=true 라 이 줄이 없어도 켜지고, 환경변수만으로도 끌 수 있다 — 여기 적어두는 건
# 그런 스위치가 있다는 걸 이 파일만 보고도 알 수 있게 하려는 것이다.
# ENDED 쿠폰 전체를 30분마다 순회하므로 발급 이력이 많으면 한 번에 수 분씩 돈다.
# 부하 테스트로 응답 시간을 잴 때는 꺼야 한다(배치가 측정 구간에 끼어든다).
#   $env:COUPON_RECONCILIATION_SCHEDULER_ENABLED="false"; .\gradlew bootRun
coupon.reconciliation.scheduler.enabled=${COUPON_RECONCILIATION_SCHEDULER_ENABLED:true}

# Admin Auth
# TODO: 배포 전 기본값(local-dev-admin-auth-code)을 제거하고 ADMIN_AUTH_CODE를 필수로 돌릴 것.
#       지금은 환경변수 없이도 로컬에서 바로 띄울 수 있도록 개발 편의용 기본값을 둔 상태다.
#       이 값이 그대로 배포되면 누구나 이 코드로 세션을 받아 /admin/** 전체를 호출할 수 있다.
#       기본값이 사용 중이면 기동 시 WARN 로그가 남는다(AdminSessionServiceImpl 참고).
admin.auth.code=${ADMIN_AUTH_CODE:local-dev-admin-auth-code}

# 발급된 세션 토큰의 유효 기간. Duration 형식(ISO-8601)이라 PT8H, PT2H, PT30M처럼 쓴다.
# 짧게 잡으면 대시보드를 볼 때마다 다시 발급받아야 하고, 길게 잡으면 토큰이 유출됐을 때
# 유효한 채로 남는 시간이 그만큼 늘어난다. 관리자가 대시보드를 하루 근무시간 동안
# 띄워두는 사용 패턴을 가정해 8시간을 기본값으로 뒀다.
# 토큰은 브라우저가 들고 있어 XSS로 새어나갈 수 있으므로, 이 값이 실질적인 피해 한도가 된다.
admin.auth.session-ttl=${ADMIN_SESSION_TTL:PT8H}

# kafka Config
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Issue pipeline logging (부하 테스트 시 ISSUE_LOG_LEVEL=WARN 등으로 낮춰서 측정 영향 최소화)
logging.level.com.mycom.petcoupon.coupon=${ISSUE_LOG_LEVEL:INFO}

# Spring이 "해결된" 예외마다 추가로 남기는 WARN을 끈다 (#191).
#
#   WARN ...ExceptionHandlerExceptionResolver : Resolved [NoResourceFoundException: ...]
#
# GlobalExceptionHandler가 이미 같은 예외를 남기므로 순수한 중복인데, 4xx를 DEBUG로 내린 뒤에도
# 이게 WARN으로 나가면 정책이 무력화된다(실측: /actuator/prometheus 폴링이 2초마다 이 WARN을 찍었다).
# Boot 기본값은 false지만 devtools가 개발 모드에서 true로 올리므로 명시적으로 고정한다.
#
# 핸들러 자체가 터졌을 때 나오는 "Failure in @ExceptionHandler"는 resolver의 별도 로거라
# 이 설정과 무관하게 계속 남는다 — 꺼지는 건 중복분뿐이다.
spring.mvc.log-resolved-exception=${LOG_RESOLVED_EXCEPTION:false}

# 로그 파일 출력 — 기본은 꺼져 있고(콘솔만), 필요할 때만 켠다.
# TC-92(단일 요청 전 구간 추적)와 발표용 선착순 시각화가 이 파일을 파싱한다.
# 콘솔만으로는 터미널을 닫는 순간 사라지고 requestId 로 grep 할 대상도 없다.
#   $env:LOG_FILE="logs/petcoupon.log"; .\gradlew bootRun
logging.file.name=${LOG_FILE:}

# 관리자 WARN/ERROR 실시간 스트림. 비즈니스 로그를 남긴 스레드는 큐에 즉시 offer만 하고,
# 큐가 가득 차면 monitoring 이벤트만 유실된다. SSE 설정 ON/OFF 상태는 DB에 저장하지 않으며
# 애플리케이션 재기동 시 기본값 ON으로 시작한다.
#
# queue-capacity는 연결 하나당 버퍼 크기다(전체 상한이 아니다). 연결마다 큐와 송신 스레드를
# 따로 두기 때문에, 느린 관리자 한 명의 큐가 넘쳐도 다른 관리자의 수신은 지연되지 않는다.
#
# 큐가 가득 차면 가장 오래된 이벤트를 버리고 최신 이벤트를 남긴다(drop-oldest, #191). 그래서 이 값은
# "보관량"이 아니라 "밀렸을 때 최신 상태까지 따라잡는 데 지나야 하는 건수"다. 예전 기본값 1000은
# 부하 상황에서 관리자가 과거 로그 990건을 다 지나야 현재 상태에 닿는다는 뜻이라 실시간 관측에
# 오히려 해로웠다. 빠진 구간은 events-dropped 이벤트와 monitoring.sse.events.dropped 지표로 알린다.
monitoring.sse.queue-capacity=${MONITORING_SSE_QUEUE_CAPACITY:50}
monitoring.sse.emitter-timeout=${MONITORING_SSE_EMITTER_TIMEOUT:PT30M}

# 동시 연결 상한. 연결마다 큐 배열과 가상 스레드를 하나씩 쓰므로, 연결을 닫지 않는 클라이언트가
# 자원을 무한정 잡지 못하게 막는 방어선이다. 초과하면 503으로 거절한다(0 이하면 제한 없음).
monitoring.sse.max-subscriptions=${MONITORING_SSE_MAX_SUBSCRIPTIONS:50}

# 관리자 화면에 올리지 않을 로거 접두사(쉼표 구분). root logger에 붙어서 프레임워크 내부
# WARN/ERROR까지 지나가는데, com.mycom.petcoupon만 남기는 허용 목록으로 가면 Hibernate·Lettuce·
# Netty가 내는 진짜 장애 로그를 놓친다. 그래서 허용이 아니라 "의미 없는 것만 제외"로 간다.
#
# 뒤의 두 항목은 피드백 루프 차단용이다(#191).
#  - ExceptionHandlerExceptionResolver: "Failure in @ExceptionHandler"가 SSE 응답이 끊긴 뒤
#    오류 본문을 쓰려다 실패할 때 나므로, 수집하면 SSE 오류 → 모니터링 이벤트 → 송신 실패로 순환한다.
#    같이 빠지는 "Resolved [...]"는 GlobalExceptionHandler 로그와 중복이라 잃는 게 없다.
#  - com.mycom.petcoupon.monitoring: 모니터링 자신의 로그. 스트림이 아파서 남긴 로그가 다시 그
#    스트림으로 들어가면 장애일수록 이벤트가 불어난다. 모니터링 자체 상태는 monitoring.sse.* 지표로 본다.
# 애플리케이션 500 오류 자체는 GlobalExceptionHandler가 남기는 ERROR로 계속 수집된다.
monitoring.sse.excluded-loggers=${MONITORING_SSE_EXCLUDED_LOGGERS:org.springframework.context.support.PostProcessorRegistrationDelegate,org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver,com.mycom.petcoupon.monitoring}

# 유휴 상태에서 연결을 살려 두기 위한 heartbeat 간격. 평시에는 WARN/ERROR가 몇 분씩
# 안 나오는 게 정상이라, 아무것도 안 보내면 프록시가 유휴 연결로 보고 끊는다.
# nginx proxy_read_timeout / ALB idle timeout이 둘 다 기본 60초이므로 그보다 짧게 잡는다.
# PT0S로 두면 heartbeat를 보내지 않는다.
monitoring.sse.heartbeat-interval=${MONITORING_SSE_HEARTBEAT_INTERVAL:PT15S}

# Consumer Config
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:petcoupon}
spring.kafka.consumer.auto-offset-reset=earliest

# DLQ Consumer group-id 분리 (#112) — 메인 Consumer(petcoupon)와 같은 group-id를 쓰면 기능상 문제는
# 없지만 모니터링/스케일링이 묶여버림. 별도 group-id로 분리해 독립적으로 운영 가능하게 함.
coupon.issue.dlq.consumer.group-id=${KAFKA_DLQ_CONSUMER_GROUP_ID:petcoupon-dlq}

# Producer 신뢰성 설정 (#112)
# acks/enable.idempotence/retries는 명시 안 해도 Kafka 3.0+부터 enable.idempotence 기본값이 true라
# acks=all, retries=Integer.MAX_VALUE로 클라이언트가 자동 강제함 — 이미 안전값이라 여기서 안 건드림.
# delivery.timeout.ms(기본 2분)만 문제: Outbox가 자체적으로 1초 주기 폴링 + 최대 5회 재시도 정책을
# 가지고 있는데, 클라이언트가 내부적으로 최대 2분씩 붙들고 있으면 이중 재시도 계층이 겹치면서
# DLQ 도달까지 최악 10분이 걸릴 수 있음. Outbox의 "빠른 실패 감지·빠른 재시도" 철학에 맞게 단축.
# delivery.timeout.ms >= request.timeout.ms + linger.ms 제약이 있어 request.timeout.ms도 같이 낮춤.
# max.block.ms: 브로커 다운 등으로 메타데이터를 가져오지 못할 때 send()가 붙잡히는 최대 시간(기본 60초).
# batch-size(100건) 처리 중 브로커 장애 시 스케줄러 스레드 장시간 블로킹을 막기 위해 10초로 단축.
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Outbox
coupon.issue.outbox.enabled=true
coupon.issue.outbox.publish-fixed-delay-ms=1000
coupon.issue.outbox.max-retry-count=5
coupon.issue.outbox.batch-size=100

# DLQ 재처리 정체 복구 (#217 후속 리뷰) — claimForReprocess로 REPROCESSING을 선점한 뒤
# 발행 콜백이 영영 안 돌아오면(인스턴스 강제 종료 등) 그 상태에 영구히 갇힌다. stale-after-ms
# 보다 오래 REPROCESSING인 행을 fixed-delay-ms 주기로 찾아 DLQ로 되돌려서, 관리자가 다시
# 재처리/포기할 수 있게 한다.
coupon.issue.dlq.reprocess-recovery.enabled=true
coupon.issue.dlq.reprocess-recovery.fixed-delay-ms=60000
coupon.issue.dlq.reprocess-recovery.stale-after-ms=300000

# issue_message 전체 상태 분포(GROUP BY status)만 짧게 캐시한다. 폴링 주기보다 길되,
# 운영 중에는 30~60초 안에서 설정한다. 예: COUPON_ISSUE_DISTRIBUTION_CACHE_TTL=PT60S
coupon.issue.statistics.distribution-cache-ttl=${COUPON_ISSUE_DISTRIBUTION_CACHE_TTL:PT30S}

# Idempotency-Key IN_PROGRESS TTL — 부하 테스트 목표(전건 확정 5분/300초 이내)의 2배 여유.
# 실측(p95/p99/p99.9/최대 처리 시간) 나오면 조정 예정(#84).
coupon.issue.idempotency.ttl-seconds=600

# Tomcat
# 부하 테스트에서 스레드·커넥션 한계를 바꿔가며 측정해야 하므로 전부 환경변수로 뺀다.
# 기본값은 Spring Boot 4.1 기본값 그대로다(spring-boot-tomcat 메타데이터 확인).
# 높은 값을 여기 박아두면 로컬·CI·통합테스트까지 그 설정으로 뜨는데,
# 부하 테스트가 아닌 상황에서는 처리량이 아니라 대기 요청과 메모리만 늘어난다.
#
# threads.max      동시에 요청을 처리하는 워커 스레드 상한
# max-connections  동시에 열어둘 수 있는 커넥션 수. 이 수를 넘으면 accept-count 큐로 밀린다
# accept-count     대기 큐 길이. 큐까지 차면 그때부터 연결이 거절된다
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# DB 커넥션 풀
# 워커 스레드를 아무리 올려도 이 값이 작으면 스레드가 풀 앞에 줄만 선다.
# 실측(로컬, 200 VU): 스레드 2000 + 풀 10 이면 400건 전부 커넥션 대기 30초 타임아웃으로 500,
# 풀만 100 으로 올리자 500 이 0 건이 됐다. 스레드와 풀은 반드시 같이 올려야 한다.
#
# 기본값 10 은 HikariCP 기본값과 같아 지금 동작을 바꾸지 않는다.
# 부하 테스트에서 적정값은 Actuator 의 hikaricp.connections.pending 이 0 을 유지하는 선까지 올려서 찾는다.
# 상한은 MySQL max_connections(부하 테스트 환경 500)이며, 앱 외에 Outbox 발행기와 스케줄러도 함께 쓴다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Spring Batch
# Spring Boot 4.1부터 spring.batch.jdbc.initialize-schema가 없어져서(BatchProperties에 없음),
# Batch 메타데이터 테이블(BATCH_JOB_INSTANCE 등)은 범용 SQL 초기화(spring.sql.init.*)로 만든다.
# 아래 BatchSchemaInitializerConfig가 실제 초기화를 담당한다 (재기동 시 테이블 존재 여부를 먼저
# 확인 — spring-batch-core의 schema-mysql.sql은 CREATE TABLE IF NOT EXISTS가 아니라서
# spring.sql.init.mode=always처럼 무조건 실행하면 두 번째 기동부터 에러가 난다).
#
# Job이 하나뿐이고 트리거(ReconciliationJobTriggerService)가 명시적으로 JobOperator를 호출하는 구조라,
# 기동 시 자동 실행(스캔된 Job을 바로 돌리는 기본 동작)은 끈다.
spring.batch.job.enabled=false

# Actuator
# 부하 테스트 중 스레드 사용량·커넥션 상태를 확인할 창구.
# 기본값에 필요한 것만 열어두고, 더 봐야 하면 ACTUATOR_ENDPOINTS 로 늘린다.
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}

# 이걸 켜야 tomcat.threads.busy / tomcat.threads.config.max 같은 지표가 등록된다.
# 끄면 Actuator 에 tomcat.sessions.* 만 나와서 정작 봐야 할 스레드 상태를 못 본다.
server.tomcat.mbeanregistry.enabled=true
