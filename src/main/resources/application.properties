spring.application.name=PetCoupon

# data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcoupon}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# jpa
spring.jpa.open-in-view=false
# ddl-auto: 스키마 확정 전까지 update, 테이블 구조가 고정되면 validate로 전환
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Redis Config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Redis Stream 
coupon.issue.stream.enabled=true
coupon.issue.stream.key=coupon:issue:stream
coupon.issue.stream.group=coupon-issue-group
coupon.issue.stream.consumer=${HOSTNAME:local}-${random.uuid}

# Event Status Scheduler
# cron 형식: 초 분 시 일 월 요일 — 기본값은 매분 0초마다 실행
event.status.scheduler.cron=0 * * * * *

# kafka Config
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Issue pipeline logging (부하 테스트 시 ISSUE_LOG_LEVEL=WARN 등으로 낮춰서 측정 영향 최소화)
logging.level.com.mycom.petcoupon.coupon=${ISSUE_LOG_LEVEL:INFO}

# Consumer Config
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:petcoupon}
spring.kafka.consumer.auto-offset-reset=earliest

# Outbox
coupon.issue.outbox.enabled=true
coupon.issue.outbox.publish-fixed-delay-ms=1000
coupon.issue.outbox.max-retry-count=5
coupon.issue.outbox.batch-size=100

# Tomcat
# 부하 테스트에서 스레드·커넥션 한계를 바꿔가며 측정해야 하므로 전부 환경변수로 뺀다.
# 기본값은 Spring Boot 4.1 기본값 그대로다(spring-boot-tomcat 메타데이터 확인).
# 높은 값을 여기 박아두면 로컬·CI·통합테스트까지 그 설정으로 뜨는데,
# 부하 테스트가 아닌 상황에서는 처리량이 아니라 대기 요청과 메모리만 늘어난다.
#
# threads.max      동시에 요청을 처리하는 워커 스레드 상한
# max-connections  동시에 열어둘 수 있는 커넥션 수. 이 수를 넘으면 accept-count 큐로 밀린다
# accept-count     대기 큐 길이. 큐까지 차면 그때부터 연결이 거절된다
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# DB 커넥션 풀
# 워커 스레드를 아무리 올려도 이 값이 작으면 스레드가 풀 앞에 줄만 선다.
# 실측(로컬, 200 VU): 스레드 2000 + 풀 10 이면 400건 전부 커넥션 대기 30초 타임아웃으로 500,
# 풀만 100 으로 올리자 500 이 0 건이 됐다. 스레드와 풀은 반드시 같이 올려야 한다.
#
# 기본값 10 은 HikariCP 기본값과 같아 지금 동작을 바꾸지 않는다.
# 부하 테스트에서 적정값은 Actuator 의 hikaricp.connections.pending 이 0 을 유지하는 선까지 올려서 찾는다.
# 상한은 MySQL max_connections(부하 테스트 환경 500)이며, 앱 외에 Outbox 발행기와 스케줄러도 함께 쓴다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Actuator
# 부하 테스트 중 스레드 사용량·커넥션 상태를 확인할 창구.
# 기본값에 필요한 것만 열어두고, 더 봐야 하면 ACTUATOR_ENDPOINTS 로 늘린다.
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}

# 이걸 켜야 tomcat.threads.busy / tomcat.threads.config.max 같은 지표가 등록된다.
# 끄면 Actuator 에 tomcat.sessions.* 만 나와서 정작 봐야 할 스레드 상태를 못 본다.
server.tomcat.mbeanregistry.enabled=true
