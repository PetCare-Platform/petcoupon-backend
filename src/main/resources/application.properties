spring.application.name=PetCoupon

# data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcoupon}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# jpa
spring.jpa.open-in-view=false
# ddl-auto: 스키마 확정 전까지 update, 테이블 구조가 고정되면 validate로 전환
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Redis Config
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Redis Stream 
coupon.issue.stream.enabled=true
coupon.issue.stream.key=coupon:issue:stream
coupon.issue.stream.group=coupon-issue-group
coupon.issue.stream.consumer=${HOSTNAME:local}-${random.uuid}
coupon.issue.stream.pending-idle-threshold-ms=30000

# Event Status Scheduler
# cron 형식: 초 분 시 일 월 요일 — 기본값은 매분 0초마다 실행
event.status.scheduler.cron=0 * * * * *

# 상태 전이 스케줄러 on/off. 기본은 켜짐이고, 앱 전체를 띄우는 테스트에서 끄는 용도다.
# 켜둔 채로 테스트를 돌리면 스케줄러가 공유 DB의 event/coupon 상태를 바꿔서
# 다른 테스트가 잡아둔 전제를 깨뜨린다(외래키 위반, 상태 불일치 등).
#
# 주기를 길게 잡는 방식은 쓰지 않는다. cron은 절대 시각 기준이라 "매시 정각"으로 두면
# 테스트가 정각을 걸치는 순간에만 실행돼, 재현되지 않는 실패가 된다.
event.status.scheduler.enabled=${EVENT_STATUS_SCHEDULER_ENABLED:true}
coupon.status.enabled=${COUPON_STATUS_SCHEDULER_ENABLED:true}

# Admin Auth
# TODO: 배포 전 기본값(local-dev-admin-auth-code)을 제거하고 ADMIN_AUTH_CODE를 필수로 돌릴 것.
#       지금은 환경변수 없이도 로컬에서 바로 띄울 수 있도록 개발 편의용 기본값을 둔 상태다.
#       이 값이 그대로 배포되면 누구나 이 코드로 세션을 받아 /admin/** 전체를 호출할 수 있다.
#       기본값이 사용 중이면 기동 시 WARN 로그가 남는다(AdminSessionServiceImpl 참고).
admin.auth.code=${ADMIN_AUTH_CODE:local-dev-admin-auth-code}

# 발급된 세션 토큰의 유효 기간. Duration 형식(ISO-8601)이라 PT8H, PT2H, PT30M처럼 쓴다.
# 짧게 잡으면 대시보드를 볼 때마다 다시 발급받아야 하고, 길게 잡으면 토큰이 유출됐을 때
# 유효한 채로 남는 시간이 그만큼 늘어난다. 관리자가 대시보드를 하루 근무시간 동안
# 띄워두는 사용 패턴을 가정해 8시간을 기본값으로 뒀다.
# 토큰은 브라우저가 들고 있어 XSS로 새어나갈 수 있으므로, 이 값이 실질적인 피해 한도가 된다.
admin.auth.session-ttl=${ADMIN_SESSION_TTL:PT8H}

# kafka Config
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Issue pipeline logging (부하 테스트 시 ISSUE_LOG_LEVEL=WARN 등으로 낮춰서 측정 영향 최소화)
logging.level.com.mycom.petcoupon.coupon=${ISSUE_LOG_LEVEL:INFO}

# Consumer Config
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:petcoupon}
spring.kafka.consumer.auto-offset-reset=earliest

# DLQ Consumer group-id 분리 (#112) — 메인 Consumer(petcoupon)와 같은 group-id를 쓰면 기능상 문제는
# 없지만 모니터링/스케일링이 묶여버림. 별도 group-id로 분리해 독립적으로 운영 가능하게 함.
coupon.issue.dlq.consumer.group-id=${KAFKA_DLQ_CONSUMER_GROUP_ID:petcoupon-dlq}

# Producer 신뢰성 설정 (#112)
# acks/enable.idempotence/retries는 명시 안 해도 Kafka 3.0+부터 enable.idempotence 기본값이 true라
# acks=all, retries=Integer.MAX_VALUE로 클라이언트가 자동 강제함 — 이미 안전값이라 여기서 안 건드림.
# delivery.timeout.ms(기본 2분)만 문제: Outbox가 자체적으로 1초 주기 폴링 + 최대 5회 재시도 정책을
# 가지고 있는데, 클라이언트가 내부적으로 최대 2분씩 붙들고 있으면 이중 재시도 계층이 겹치면서
# DLQ 도달까지 최악 10분이 걸릴 수 있음. Outbox의 "빠른 실패 감지·빠른 재시도" 철학에 맞게 단축.
# delivery.timeout.ms >= request.timeout.ms + linger.ms 제약이 있어 request.timeout.ms도 같이 낮춤.
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# Outbox
coupon.issue.outbox.enabled=true
coupon.issue.outbox.publish-fixed-delay-ms=1000
coupon.issue.outbox.max-retry-count=5
coupon.issue.outbox.batch-size=100

# DLQ 수동 재처리 관리자 API
coupon.issue.dlq.list-size=100

# Idempotency-Key IN_PROGRESS TTL — 부하 테스트 목표(전건 확정 5분/300초 이내)의 2배 여유.
# 실측(p95/p99/p99.9/최대 처리 시간) 나오면 조정 예정(#84).
coupon.issue.idempotency.ttl-seconds=600

# Tomcat
# 부하 테스트에서 스레드·커넥션 한계를 바꿔가며 측정해야 하므로 전부 환경변수로 뺀다.
# 기본값은 Spring Boot 4.1 기본값 그대로다(spring-boot-tomcat 메타데이터 확인).
# 높은 값을 여기 박아두면 로컬·CI·통합테스트까지 그 설정으로 뜨는데,
# 부하 테스트가 아닌 상황에서는 처리량이 아니라 대기 요청과 메모리만 늘어난다.
#
# threads.max      동시에 요청을 처리하는 워커 스레드 상한
# max-connections  동시에 열어둘 수 있는 커넥션 수. 이 수를 넘으면 accept-count 큐로 밀린다
# accept-count     대기 큐 길이. 큐까지 차면 그때부터 연결이 거절된다
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# DB 커넥션 풀
# 워커 스레드를 아무리 올려도 이 값이 작으면 스레드가 풀 앞에 줄만 선다.
# 실측(로컬, 200 VU): 스레드 2000 + 풀 10 이면 400건 전부 커넥션 대기 30초 타임아웃으로 500,
# 풀만 100 으로 올리자 500 이 0 건이 됐다. 스레드와 풀은 반드시 같이 올려야 한다.
#
# 기본값 10 은 HikariCP 기본값과 같아 지금 동작을 바꾸지 않는다.
# 부하 테스트에서 적정값은 Actuator 의 hikaricp.connections.pending 이 0 을 유지하는 선까지 올려서 찾는다.
# 상한은 MySQL max_connections(부하 테스트 환경 500)이며, 앱 외에 Outbox 발행기와 스케줄러도 함께 쓴다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Spring Batch
# Spring Boot 4.1부터 spring.batch.jdbc.initialize-schema가 없어져서(BatchProperties에 없음),
# Batch 메타데이터 테이블(BATCH_JOB_INSTANCE 등)은 범용 SQL 초기화(spring.sql.init.*)로 만든다.
# 아래 BatchSchemaInitializerConfig가 실제 초기화를 담당한다 (재기동 시 테이블 존재 여부를 먼저
# 확인 — spring-batch-core의 schema-mysql.sql은 CREATE TABLE IF NOT EXISTS가 아니라서
# spring.sql.init.mode=always처럼 무조건 실행하면 두 번째 기동부터 에러가 난다).
#
# Job이 하나뿐이고 트리거(ReconciliationJobTriggerService)가 명시적으로 JobOperator를 호출하는 구조라,
# 기동 시 자동 실행(스캔된 Job을 바로 돌리는 기본 동작)은 끈다.
spring.batch.job.enabled=false

# Actuator
# 부하 테스트 중 스레드 사용량·커넥션 상태를 확인할 창구.
# 기본값에 필요한 것만 열어두고, 더 봐야 하면 ACTUATOR_ENDPOINTS 로 늘린다.
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}

# 이걸 켜야 tomcat.threads.busy / tomcat.threads.config.max 같은 지표가 등록된다.
# 끄면 Actuator 에 tomcat.sessions.* 만 나와서 정작 봐야 할 스레드 상태를 못 본다.
server.tomcat.mbeanregistry.enabled=true
